plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Curios API is distributed through Modrinth's Maven-compatible endpoint.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

// Shared config for every domain subproject (affix, combat, blightlands, crafting, currency,
// unique - see settings.gradle) - each is a plain java-library that also needs Minecraft/NeoForge
// on its OWN compile classpath (net.neoforged.moddev provides that), but none of them define their
// own runs{}/mods{} - this root project is the actual mod, and its own neoForge.mods{} block below
// binds every subproject's sourceSet into the one "tumultu" mod (confirmed supported by moddev-gradle
// itself: ModModel.sourceSet(SourceSet) accepts repeated calls, including source sets that belong to
// other projects - see RunUtils.findSourceSetProject's own comment acknowledging cross-project source
// sets as an intentional use of the DSL, not a hack).
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'net.neoforged.moddev'

    java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    repositories {
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
    }

    neoForge {
        version = rootProject.neo_version
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    // Same reasoning as root's own copy of this: the moddev plugin wires Minecraft/NeoForge onto
    // 'main' through its own machinery rather than plain dependency notations, so 'test' doesn't
    // inherit it automatically here either.
    sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
    sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.mockito:mockito-core:5.23.0'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    }

    tasks.named('test', Test).configure {
        useJUnitPlatform()
        jvmArgs '-XX:+EnableDynamicAgentLoading'
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        //
        // Every domain subproject's own main sourceSet is bound to this SAME one mod - this is what
        // makes runClient/runServer see all of them as belonging to "tumultu" (confirmed real,
        // supported moddev-gradle behavior, not a workaround - see the subprojects{} block above).
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':affix').sourceSets.main)
            sourceSet(project(':unique').sourceSets.main)
            sourceSet(project(':combat').sourceSets.main)
            sourceSet(project(':blightlands').sourceSets.main)
            sourceSet(project(':currency').sourceSets.main)
            sourceSet(project(':crafting').sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// The NeoForge moddev plugin wires Minecraft/NeoForge onto the 'main' source set's classpath
// through its own machinery rather than plain dependency notations, so 'test' does not inherit
// it automatically the way a normal Gradle source set relationship would. Extend it explicitly.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output

dependencies {
    // Domain subprojects (see settings.gradle) - the registries/entry point in this root module
    // reference their concrete classes directly, so this needs to be a real compile dependency, not
    // just a runtime one. Gradle's `implementation` isn't transitive, so each project that directly
    // uses another project's classes declares its own dependency on it - relying on hidden
    // transitivity here would be fragile.
    implementation project(':affix')
    implementation project(':unique')
    implementation project(':combat')
    implementation project(':blightlands')
    implementation project(':currency')
    implementation project(':crafting')

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'

    // Curios API - required (not optional/localRuntime) dependency: this mod's ring/amulet/
    // trinket items only function with Curios installed. "implementation" (unlike localRuntime)
    // is published as a real transitive dependency of this mod, consistent with it being
    // required rather than optional. Modrinth's Maven proxy doesn't cleanly expose Curios' own
    // compile-only "-api" classifier jar (it resolves to the same full jar either way), so there's
    // no separate compileOnly line here - just the one dependency, used for both.
    implementation "maven.modrinth:curios:${curios_version}"

    // TerraBlender - see gradle.properties' terrablender_version comment for why it's pinned by
    // Modrinth version id. Required (not localRuntime) since the tier-1 biome's region
    // registration depends on it at runtime.
    implementation "maven.modrinth:terrablender:${terrablender_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// The neoForge.mods{} block above only wires domain subprojects into DEV RUNS (runClient/
// runServer) - the actual distributable jar produced by `build`/`jar` doesn't get their classes
// for free, since `implementation project(...)` is a normal (non-bundling) Gradle dependency. Merge
// each subproject's compiled output+resources into this one jar so the real build isn't missing
// content that only worked in dev runs.
tasks.named('jar', Jar).configure {
    from(project(':affix').sourceSets.main.output)
    from(project(':unique').sourceSets.main.output)
    from(project(':combat').sourceSets.main.output)
    from(project(':blightlands').sourceSets.main.output)
    from(project(':currency').sourceSets.main.output)
    from(project(':crafting').sourceSets.main.output)
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    jvmArgs '-XX:+EnableDynamicAgentLoading'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
